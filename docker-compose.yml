services:
  scrumboard-medguia:
    image: ghcr.io/ranieryfialho/scrumboard-medguia:${IMAGE_TAG:-latest}
    container_name: scrumboard-medguia
    ports:
      - "3001:3000"
    env_file:
      - .env
    # fase2c-anexos (ASM-025): prints/PDF de evidência ficam neste volume
    # nomeado e são servidos só por URL assinada. `ANEXOS_SEGREDO` (segredo
    # da assinatura) vem do `.env`, nunca daqui.
    environment:
      ANEXOS_DIR: /data/anexos
    volumes:
      - anexos:/data/anexos
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2000m
    networks:
      - wp-network

  # fase3-ingestao-continua (AC-328): a imagem de worker do projeto (`scrumboard-medguia-worker`, estágio `worker` do
  # Dockerfile: código de `src`, dependências de produção e `tsx`), com o comando de entrada do worker
  # (`npm run worker`, src/worker/index.ts). Sem `ports:` — o worker não serve HTTP, só roda os ciclos (T-128) e o
  # agendador (T-130). A imagem do site (`scrumboard-medguia`) não traz o código do worker.
  crm-worker:
    image: ghcr.io/ranieryfialho/scrumboard-medguia-worker:${IMAGE_TAG:-latest}
    container_name: crm-worker
    command: ["npm", "run", "worker"]
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - |
          npx tsx -e "
          import('./src/worker/config').then(async ({ carregarConfiguracaoWorker }) => {
            const { verificarSaudeWorker } = await import('./src/worker/saude');
            const { Pool } = await import('pg');
            const { drizzle } = await import('drizzle-orm/node-postgres');
            const config = carregarConfiguracaoWorker();
            const pool = new Pool({ connectionString: config.databaseUrl });
            const db = drizzle(pool);
            const resultado = await verificarSaudeWorker(db, ['import-sheets', 'import-lp'], config.intervaloImportacaoMin);
            await pool.end();
            process.exit(resultado.status === 'saudavel' ? 0 : 1);
          }).catch(() => process.exit(1));
          "
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 500m
    networks:
      - wp-network

  # T-266 (fase5-email-disparo, ASM-261): o disparo das campanhas de e-mail num segundo container, com a imagem de worker
  # do CRM e o comando `npm run worker:email` (src/worker/email.ts). Só precisa de DATABASE_URL e SEGREDO_CONFIGURACOES;
  # uma rajada de e-mails não ocupa o `crm-worker` da ingestão. Sem `ports:` nem healthcheck próprio (o ciclo é um laço
  # simples de 10 s).
  crm-worker-email:
    image: ghcr.io/ranieryfialho/scrumboard-medguia-worker:${IMAGE_TAG:-latest}
    container_name: crm-worker-email
    command: ["npm", "run", "worker:email"]
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300m
    networks:
      - wp-network

  # Postgres compartilhado com outros projetos na VPS (RFC-001 §1.3). Sem
  # `ports:` — acesso só pela rede Docker interna `wp-network` ou por túnel
  # SSH para administração (AC-009). Databases/roles do CRM são provisionados
  # por infra/postgres/init/01-databases-and-roles.sql (AC-005, AC-007, AC-008).
  pg-master:
    image: postgres:15-alpine
    container_name: pg-master
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      CRM_APP_PASSWORD: ${CRM_APP_PASSWORD}
      CRM_MIGRATOR_PASSWORD: ${CRM_MIGRATOR_PASSWORD}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1000m
    volumes:
      - /root/postgres/data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - wp-network

volumes:
  anexos:

networks:
  wp-network:
    external: true
