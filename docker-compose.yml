services:
  scrumboard-medguia:
    image: ghcr.io/ranieryfialho/scrumboard-medguia:${IMAGE_TAG:-latest}
    container_name: scrumboard-medguia
    ports:
      - "3001:3000"
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2000m
    networks:
      - wp-network

networks:
  wp-network:
    external: true
