name: Deploy na VPS
description: Copia deploy/deploy.sh para a VPS e roda por SSH (backup, migrations pendentes, troca da imagem, teste de saúde, rollback).
inputs:
  ambiente: { description: 'staging ou prod', required: true }
  sha: { description: 'SHA completo da imagem', required: true }
  host: { required: true }
  usuario: { required: true }
  chave: { required: true }
  ignorar_staging: { description: 'true = produção sem exigir a mesma versão no staging', required: false, default: 'false' }
runs:
  using: composite
  steps:
    - shell: bash
      env:
        AMBIENTE: ${{ inputs.ambiente }}
        SHA: ${{ inputs.sha }}
        HOST: ${{ inputs.host }}
        USUARIO: ${{ inputs.usuario }}
        CHAVE: ${{ inputs.chave }}
        IGNORAR: ${{ inputs.ignorar_staging }}
      run: |
        set -euo pipefail
        [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "SHA inválido: $SHA"; exit 1; }
        install -m 700 -d ~/.ssh
        printf '%s\n' "$CHAVE" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -T 10 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
        SSH="ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 $USUARIO@$HOST"
        # O script é copiado para a VPS e executado como ARQUIVO: se fosse lido pelo stdin do bash, qualquer comando que leia o stdin
        # (docker exec -i, por exemplo) engoliria o resto do script e o deploy terminaria "com sucesso" pela metade.
        $SSH "cat > /tmp/deploy-crm.sh && chmod 700 /tmp/deploy-crm.sh" < deploy/deploy.sh
        $SSH "bash /tmp/deploy-crm.sh '$AMBIENTE' '$SHA' '$IGNORAR' < /dev/null" 2>&1 | tee /tmp/saida-deploy.txt
        # Só vale se o script chegou ao fim: sem a marca, o deploy não terminou (mesmo que o ssh devolva 0).
        grep -q 'DEPLOY_CONCLUIDO' /tmp/saida-deploy.txt || { echo '::error::o deploy não chegou ao fim (sem DEPLOY_CONCLUIDO)'; exit 1; }
