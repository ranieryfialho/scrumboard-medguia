name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck
        env:
          # fase1-auth-rbac (Better Auth) aumentou bastante a superfície de
          # tipos do projeto (~3,5M linhas de definições instanciadas) — o
          # heap default do Node no runner (~2GB) não é suficiente.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          # Mesmo motivo do passo de Checagem de tipos: o `next build`
          # roda sua própria checagem de tipos internamente.
          NODE_OPTIONS: --max-old-space-size=4096
