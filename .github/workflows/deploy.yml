name: Deploy Scrumboard para VPS

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Copiar arquivos para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".,!.git,!.github,!.next,!node_modules"
          target: "~/scrumboard-medguia"
          timeout: 60s
          command_timeout: 10m

      - name: Construir e Ligar o Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/scrumboard-medguia
            source .env
            docker compose build --no-cache
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps --filter "status=running" | grep scrumboard-medguia
