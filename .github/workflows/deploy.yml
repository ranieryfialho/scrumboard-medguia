name: Deploy Scrumboard para VPS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag da imagem no GHCR (SHA do commit) a implantar. Para rollback, informe o SHA de uma imagem anterior já publicada.'
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Copiar docker-compose.yml para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/scrumboard-medguia"
          timeout: 60s
          command_timeout: 10m

      - name: Login no GHCR, pull da imagem por tag e subida do container (sem build)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          envs: IMAGE_TAG
          script: |
            set -e
            cd ~/scrumboard-medguia
            source .env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG="$IMAGE_TAG"
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps --filter "status=running" | grep scrumboard-medguia
