name: Deploy do CRM

# Depois que o Release publica a imagem de um commit na main, o staging recebe a versão SOZINHO. A produção só sobe depois do
# clique de aprovação do environment `producao` (Settings > Environments > producao > Required reviewers).
# Também dá para disparar à mão (Actions > Deploy do CRM > Run workflow) com um SHA qualquer: serve de rollback.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'SHA completo (40 caracteres) da imagem já publicada no GHCR. Vazio = o último commit da main.'
        required: false
        type: string
      ambiente:
        description: 'Onde implantar'
        required: true
        default: staging
        type: choice
        options: [staging, producao]

# Um deploy por vez, e nunca cancelado no meio (cancelar deixaria a troca pela metade).
concurrency:
  group: deploy-crm
  cancel-in-progress: false

permissions:
  contents: read

env:
  SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}

jobs:
  staging:
    # Automático após Release verde; manual quando escolhido staging (ou produção, que passa por aqui primeiro).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Checkout (script e ação de deploy da main; o SHA implantado vai como argumento)
        uses: actions/checkout@v4
      - name: Deploy no staging
        uses: ./.github/actions/deploy-vps
        with:
          ambiente: staging
          sha: ${{ env.SHA }}
          host: ${{ secrets.VPS_HOST }}
          usuario: ${{ secrets.VPS_USER }}
          chave: ${{ secrets.VPS_SSH_KEY }}

  producao:
    needs: staging
    if: github.event_name == 'workflow_run' || inputs.ambiente == 'producao'
    runs-on: ubuntu-latest
    # Este environment deve ter "Required reviewers": o job fica aguardando o seu clique em Review deployments > Approve.
    environment: producao
    timeout-minutes: 20
    steps:
      - name: Checkout (script e ação de deploy da main; o SHA implantado vai como argumento)
        uses: actions/checkout@v4
      - name: Deploy na produção
        uses: ./.github/actions/deploy-vps
        with:
          ambiente: prod
          sha: ${{ env.SHA }}
          host: ${{ secrets.VPS_HOST }}
          usuario: ${{ secrets.VPS_USER }}
          chave: ${{ secrets.VPS_SSH_KEY }}
