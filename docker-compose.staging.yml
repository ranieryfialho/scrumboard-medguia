services:
  # Staging do CRM — mesma VPS, mesma rede `wp-network` e mesmo
  # nginx-proxy-manager de produção. Sem `ports:` publicado: o proxy alcança
  # o container pela rede Docker interna e só quem tem o link/credencial do
  # host virtual configurado no proxy acessa (AC-006). Conecta só em
  # `crm_staging` (AC-005), nunca em `crm_prod`.
  crm-app-staging:
    image: ghcr.io/ranieryfialho/scrumboard-medguia:${IMAGE_TAG:-latest}
    container_name: crm-app-staging
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: postgres://crm_app:${CRM_APP_PASSWORD}@pg-master:5432/crm_staging
    # Anexos (evidências, mídia e foto do WhatsApp) ficam em `/data/anexos`. Sem volume eles moravam na camada do container e SUMIAM a cada
    # deploy (o container é recriado); a produção já usa um volume nomeado. Só o app grava aí (o worker não precisa).
    volumes:
      - anexos_staging:/data/anexos
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1000m
    networks:
      - wp-network

  # fase3-ingestao-continua (AC-328): worker de staging — imagem de worker do projeto (estágio `worker` do Dockerfile),
  # comando de entrada `npm run worker`, conectado só em `crm_staging` (AC-005/AC-006, mesma regra do app de staging).
  crm-worker-staging:
    image: ghcr.io/ranieryfialho/scrumboard-medguia-worker:${IMAGE_TAG:-latest}
    container_name: crm-worker-staging
    command: ["npm", "run", "worker"]
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: postgres://crm_app:${CRM_APP_PASSWORD}@pg-master:5432/crm_staging
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - npx tsx src/worker/healthcheck.ts
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 500m
    networks:
      - wp-network

volumes:
  anexos_staging:

networks:
  wp-network:
    external: true
